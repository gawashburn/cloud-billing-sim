[package]
name = "cloud-billing-sim"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Geoffrey Washburn <geoffrey.washburn@gmail.com>"]
license = "MIT"
description = "A simulator for computing cloud object storage costs from API operations"
repository = "https://github.com/geoffw/cloud-billing-sim"
keywords = ["cloud", "s3", "billing", "simulator"]
categories = ["command-line-utilities", "simulation"]

[features]
default = []
s3-validation = ["dep:aws-sdk-s3", "dep:aws-sdk-pricing", "dep:aws-config", "dep:tokio"]
b2-validation = ["dep:reqwest", "dep:tokio"]
r2-validation = ["dep:aws-sdk-s3", "dep:aws-config", "dep:tokio"]

[dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mutants = "0.0.3"

# Optional dependencies for cloud validation
aws-sdk-s3 = { version = "1", optional = true }
aws-sdk-pricing = { version = "1", optional = true }
aws-config = { version = "1", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
tracing-test = "0.2"

[[bench]]
name = "benchmarks"
harness = false

[lints.rust]
unsafe_code = "forbid"
# Allow kani cfg for formal verification
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
unwrap_used = "warn"
expect_used = "warn"
